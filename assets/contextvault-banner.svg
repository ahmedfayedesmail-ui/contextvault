<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">ContextVault — Local-first codebase context</title>
  <desc id="desc">A dark technical banner showing a connected code graph and local search context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10152b"/>
      <stop offset=".55" stop-color="#171b38"/>
      <stop offset="1" stop-color="#101b2d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset=".52" stop-color="#8b9cff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#6475e8" stop-opacity=".30"/>
      <stop offset="1" stop-color="#6475e8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#91a4dc" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1440" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="560" rx="28" fill="url(#grid)"/>
  <circle cx="1100" cy="270" r="360" fill="url(#halo)"/>
  <circle cx="1300" cy="40" r="160" fill="#8b5cf6" opacity=".08" filter="url(#soft)"/>
  <path d="M0 470C250 390 370 590 650 490S1110 390 1440 470V560H0Z" fill="#080d1e" opacity=".36"/>
  <g transform="translate(96 96)">
    <rect x="0" y="0" width="228" height="42" rx="21" fill="#202a4b" stroke="#53648e" stroke-opacity=".65"/>
    <circle cx="22" cy="21" r="5" fill="#fb923c"/>
    <text x="40" y="27" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">LOCAL-FIRST DEVELOPER TOOL</text>
    <text x="0" y="132" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="750" letter-spacing="-3">Context<tspan fill="url(#accent)">Vault</tspan></text>
    <text x="3" y="190" fill="#c5cee4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="500">Your codebase. Searchable context.</text>
    <text x="3" y="231" fill="#c5cee4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="500">Kept on your machine.</text>
    <g transform="translate(0 286)">
      <rect x="0" y="0" width="174" height="46" rx="12" fill="#1d2a49" stroke="#52658f"/>
      <circle cx="22" cy="23" r="5" fill="#67e8f9"/>
      <text x="38" y="29" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Semantic search</text>
      <rect x="188" y="0" width="158" height="46" rx="12" fill="#1d2a49" stroke="#52658f"/>
      <circle cx="210" cy="23" r="5" fill="#a78bfa"/>
      <text x="226" y="29" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Local Ollama</text>
      <rect x="360" y="0" width="114" height="46" rx="12" fill="#1d2a49" stroke="#52658f"/>
      <circle cx="382" cy="23" r="5" fill="#fb923c"/>
      <text x="398" y="29" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">MCP</text>
    </g>
  </g>
  <g transform="translate(790 76)">
    <circle cx="270" cy="208" r="205" fill="none" stroke="#7183c8" stroke-opacity=".13" stroke-width="1.5"/>
    <circle cx="270" cy="208" r="160" fill="none" stroke="#7183c8" stroke-opacity=".16" stroke-width="1.5" stroke-dasharray="5 10"/>
    <circle cx="270" cy="208" r="112" fill="none" stroke="#7183c8" stroke-opacity=".18" stroke-width="1.5"/>
    <g stroke="url(#accent)" stroke-width="2.5" stroke-opacity=".7" fill="none">
      <path d="M270 208L135 110L62 178L145 302L270 208L396 104L475 196L402 322L270 208L316 398"/>
      <path d="M135 110L250 42L396 104M145 302L80 390L210 444L316 398L402 322M475 196L520 300"/>
      <path d="M62 178L35 276L145 302M396 104L448 45"/>
    </g>
    <g fill="#182747" stroke="#7dd3fc" stroke-width="2.4">
      <circle cx="270" cy="208" r="22" fill="#273b68" stroke="#fb923c" stroke-width="3"/>
      <circle cx="135" cy="110" r="13"/><circle cx="62" cy="178" r="10"/>
      <circle cx="145" cy="302" r="13"/><circle cx="396" cy="104" r="14"/>
      <circle cx="475" cy="196" r="11"/><circle cx="402" cy="322" r="13"/>
      <circle cx="316" cy="398" r="10"/><circle cx="250" cy="42" r="9"/>
      <circle cx="80" cy="390" r="8"/><circle cx="210" cy="444" r="8"/>
      <circle cx="520" cy="300" r="8"/><circle cx="448" cy="45" r="8"/>
      <circle cx="35" cy="276" r="7"/>
    </g>
    <g filter="url(#glow)">
      <circle cx="270" cy="208" r="7" fill="#fb923c"/>
      <circle cx="396" cy="104" r="4" fill="#67e8f9"/>
      <circle cx="145" cy="302" r="4" fill="#c084fc"/>
    </g>
    <g transform="translate(330 244)">
      <rect x="0" y="0" width="194" height="94" rx="15" fill="#17213d" stroke="#566b9c" stroke-width="1.4"/>
      <rect x="17" y="18" width="28" height="28" rx="7" fill="#273b68"/>
      <path d="M25 25h12M25 31h12M25 37h8" stroke="#8be9f5" stroke-width="2" stroke-linecap="round"/>
      <text x="56" y="31" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">PROJECT INDEX</text>
      <text x="17" y="70" fill="#9fb0d2" font-family="ui-monospace,Consolas,monospace" font-size="13">files → chunks → vectors</text>
    </g>
    <g transform="translate(2 32)">
      <rect x="0" y="0" width="170" height="66" rx="13" fill="#17213d" stroke="#566b9c" stroke-width="1.3"/>
      <circle cx="20" cy="22" r="5" fill="#67e8f9"/>
      <text x="34" y="27" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">OLLAMA</text>
      <text x="18" y="49" fill="#9fb0d2" font-family="ui-monospace,Consolas,monospace" font-size="11">local embeddings</text>
    </g>
    <g transform="translate(355 4)">
      <rect x="0" y="0" width="164" height="66" rx="13" fill="#17213d" stroke="#566b9c" stroke-width="1.3"/>
      <circle cx="20" cy="22" r="5" fill="#fb923c"/>
      <text x="34" y="27" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">MCP SERVER</text>
      <text x="18" y="49" fill="#9fb0d2" font-family="ui-monospace,Consolas,monospace" font-size="11">AI client tools</text>
    </g>
  </g>
  <text x="96" y="512" fill="#8190b5" font-family="ui-monospace,Consolas,monospace" font-size="14" letter-spacing="1.6">OLLAMA  /  SQLITE  /  MODEL CONTEXT PROTOCOL</text>
  <text x="1344" y="512" text-anchor="end" fill="#8190b5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">BUILT FOR DEVELOPERS</text>
</svg>