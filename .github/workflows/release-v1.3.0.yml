name: Publish ContextVault v1.3.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v1.3.0.yml"
      - ".github/releases/v1.3.0.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish v1.3.0
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate metadata, CI, and existing release
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "1.3.0" ]]; then
            echo "::error::package.json version is $package_version, expected 1.3.0."
            exit 1
          fi

          if ! grep -Fq 'const SERVER_VERSION = "1.3.0";' src/mcp.ts; then
            echo "::error::MCP server version does not match 1.3.0."
            exit 1
          fi

          if [[ ! -f .github/releases/v1.3.0.md ]]; then
            echo "::error::Release notes file is missing."
            exit 1
          fi

          tag_sha="$(git ls-remote --tags origin refs/tags/v1.3.0 | awk 'NR == 1 { print $1 }')"
          release_exists=false
          if gh release view v1.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          fi

          if [[ -n "$tag_sha" && "$release_exists" == "true" ]]; then
            release_json="$(gh release view v1.3.0 --repo "$GITHUB_REPOSITORY" --json url,tagName,targetCommitish,isDraft,isPrerelease,publishedAt)"
            release_tag="$(jq -r '.tagName' <<< "$release_json")"
            release_target="$(jq -r '.targetCommitish' <<< "$release_json")"
            is_draft="$(jq -r '.isDraft' <<< "$release_json")"
            is_prerelease="$(jq -r '.isPrerelease' <<< "$release_json")"

            if [[ "$release_tag" != "v1.3.0" || "$release_target" != "$tag_sha" || "$is_draft" != "false" || "$is_prerelease" != "false" ]]; then
              echo "::error::Existing v1.3.0 tag/release does not match the published stable release. Refusing to alter it."
              exit 1
            fi

            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "The stable v1.3.0 release already exists and its tag/release match. No overwrite will be attempted."
            exit 0
          fi

          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag v1.3.0 exists at a different commit and no matching release exists. Refusing to retarget it."
            exit 1
          fi

          if [[ -z "$tag_sha" && "$release_exists" == "true" ]]; then
            echo "::error::A v1.3.0 release exists without its expected tag. Manual review is required."
            exit 1
          fi

          echo "Waiting for Ubuntu and Windows CI checks on $GITHUB_SHA..."
          ci_passed=false

          for attempt in $(seq 1 90); do
            check_json="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs")"

            ubuntu_status="$(jq -r '[.check_runs[] | select(.name == "test (ubuntu-latest)")] | sort_by(.id) | if length == 0 then "missing" else (last.status + ":" + (last.conclusion // "")) end' <<< "$check_json")"
            windows_status="$(jq -r '[.check_runs[] | select(.name == "test (windows-latest)")] | sort_by(.id) | if length == 0 then "missing" else (last.status + ":" + (last.conclusion // "")) end' <<< "$check_json")"

            echo "CI poll $attempt: Ubuntu=$ubuntu_status; Windows=$windows_status"

            if [[ "$ubuntu_status" == "completed:success" && "$windows_status" == "completed:success" ]]; then
              ci_passed=true
              break
            fi

            if [[ "$ubuntu_status" == completed:* && "$ubuntu_status" != "completed:success" ]]; then
              echo "::error::Ubuntu CI did not pass: $ubuntu_status"
              exit 1
            fi

            if [[ "$windows_status" == completed:* && "$windows_status" != "completed:success" ]]; then
              echo "::error::Windows CI did not pass: $windows_status"
              exit 1
            fi

            sleep 10
          done

          if [[ "$ci_passed" != "true" ]]; then
            echo "::error::Timed out waiting for both platform CI checks to pass."
            exit 1
          fi

          echo "already_published=false" >> "$GITHUB_OUTPUT"
          echo "Release preflight passed for $GITHUB_SHA."

      - name: Create the v1.3.0 tag and GitHub Release
        if: steps.preflight.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.3.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ContextVault v1.3.0" \
            --notes-file .github/releases/v1.3.0.md \
            --latest

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh release view v1.3.0 --repo "$GITHUB_REPOSITORY" --json url,tagName,targetCommitish,isDraft,isPrerelease,publishedAt)"
          release_tag="$(jq -r '.tagName' <<< "$release_json")"
          tag_sha="$(git ls-remote --tags origin refs/tags/v1.3.0 | awk 'NR == 1 { print $1 }')"
          release_target="$(jq -r '.targetCommitish' <<< "$release_json")"

          [[ "$release_tag" == "v1.3.0" ]]
          [[ -n "$tag_sha" && "$release_target" == "$tag_sha" ]]
          [[ "$(jq -r '.isDraft' <<< "$release_json")" == "false" ]]
          [[ "$(jq -r '.isPrerelease' <<< "$release_json")" == "false" ]]

          echo "$release_json"
