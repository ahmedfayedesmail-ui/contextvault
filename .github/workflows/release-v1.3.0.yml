name: Publish ContextVault v1.3.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish v1.3.0
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release metadata, CI, and tag availability
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "1.3.0" ]]; then
            echo "::error::package.json version is $package_version, expected 1.3.0."
            exit 1
          fi

          if ! grep -Fq 'const SERVER_VERSION = "1.3.0";' src/mcp.ts; then
            echo "::error::MCP server version does not match 1.3.0."
            exit 1
          fi

          if [[ ! -f .github/releases/v1.3.0.md ]]; then
            echo "::error::Release notes file is missing."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin refs/tags/v1.3.0 >/dev/null 2>&1; then
            echo "::error::Tag v1.3.0 already exists. Refusing to overwrite or retarget it."
            exit 1
          fi

          if gh release view v1.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v1.3.0 already exists. Refusing to replace it."
            exit 1
          fi

          passing_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select((.name == "test (ubuntu-latest)" or .name == "test (windows-latest)") and .status == "completed" and .conclusion == "success")] | length')"

          if [[ "$passing_checks" != "2" ]]; then
            echo "::error::Both Ubuntu and Windows CI checks must pass on this exact release commit. Found $passing_checks successful platform checks."
            exit 1
          fi

          echo "Release preflight passed for commit $GITHUB_SHA."

      - name: Create the v1.3.0 tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.3.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ContextVault v1.3.0" \
            --notes-file .github/releases/v1.3.0.md \
            --latest
